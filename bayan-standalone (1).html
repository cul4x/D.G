<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="emerald" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بَيَان | BAYAN — رحلة في أسرار اللغة العربية</title>
<meta name="description" content="بَيَان: موسوعة تفاعلية متكاملة للنحو والصرف والإملاء العربي.">
<meta name="theme-color" content="#123D32" id="meta-theme">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ بَيَان | BAYAN — الأنماط ============ */
:root{
  --font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;
  --font-text:'Amiri','Traditional Arabic','Noto Naskh Arabic','Times New Roman',serif;
  --fs:19; --lh:1.9;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.06);
  --ok:#1f7a4d; --ok-bg:#e6f4ec; --bad:#a4332c; --bad-bg:#f9e8e6;
}
/* ---------- الثيمات (فاتح) ---------- */
[data-theme="emerald"]{
  --primary:#123D32; --secondary:#EDE5D5; --bg:#FAF9F5; --accent:#B69A68;
  --accent-text:#7B6330; --surface:#FFFFFF; --surface2:#F4EFE3; --text:#1D2A25; --muted:#5B6862;
  --border:#E3DCCB; --on-primary:#FAF9F5; --head:#123D32;
}
[data-theme="navy"]{
  --primary:#182B49; --secondary:#DCE3EB; --bg:#F7F8FA; --accent:#A6B4C5;
  --accent-text:#4D5F77; --surface:#FFFFFF; --surface2:#EEF2F6; --text:#1B2535; --muted:#586374;
  --border:#DDE3EA; --on-primary:#F7F8FA; --head:#182B49;
}
[data-theme="burgundy"]{
  --primary:#642D3A; --secondary:#E9DDCA; --bg:#FAF7F1; --accent:#B38B65;
  --accent-text:#7C5A38; --surface:#FFFFFF; --surface2:#F4ECDD; --text:#2B1D21; --muted:#6A5A5E;
  --border:#E8DDCB; --on-primary:#FAF7F1; --head:#642D3A;
}
/* ---------- الثيمات (ليلي) ---------- */
[data-theme="emerald"][data-mode="dark"]{
  --primary:#1E5A49; --bg:#0E1815; --surface:#15241F; --surface2:#1B2E27; --text:#EDE8DC; --muted:#A9B3AC;
  --border:#2A3F37; --head:#D6BE8E; --accent-text:#D6BE8E; --ok-bg:#12301f; --bad-bg:#3a1a17; --ok:#7fd1a3; --bad:#f0a199;
}
[data-theme="navy"][data-mode="dark"]{
  --primary:#2A4672; --bg:#0E1522; --surface:#162033; --surface2:#1C2A41; --text:#E8ECF1; --muted:#A3AEBC;
  --border:#2B3A55; --head:#C3CEDB; --accent-text:#C3CEDB; --ok-bg:#12301f; --bad-bg:#3a1a17; --ok:#7fd1a3; --bad:#f0a199;
}
[data-theme="burgundy"][data-mode="dark"]{
  --primary:#8A4558; --bg:#1A1013; --surface:#26171B; --surface2:#301E23; --text:#F0E6DA; --muted:#B9A9A2;
  --border:#4A2E36; --head:#D9B995; --accent-text:#D9B995; --ok-bg:#12301f; --bad-bg:#3a1a17; --ok:#7fd1a3; --bad:#f0a199;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font-ui);font-size:16px;line-height:1.7;color:var(--text);
  background:var(--bg);transition:background-color .25s,color .25s;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--head);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 16px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{top:8px}
[hidden]{display:none!important}

/* ---------- الترويسة ---------- */
.site-header{position:sticky;top:0;z-index:40;background:var(--primary);color:var(--on-primary);border-bottom:3px solid var(--accent);transition:background-color .25s}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-primary)}
.brand:hover{text-decoration:none}
.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);font-family:var(--font-text);font-size:26px;font-weight:700;line-height:1;padding-bottom:6px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-family:var(--font-text);font-size:24px}
.brand-text small{letter-spacing:.3em;font-size:10px;opacity:.8;direction:ltr;text-align:start}
.actions{display:flex;gap:4px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--on-primary)}
.icon-btn:hover{background:rgba(255,255,255,.12);text-decoration:none}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:3px;inset-inline-end:3px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#1b1b1b;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

main{padding-top:20px;padding-bottom:40px;min-height:70vh;outline:0}
h1,h2,h3{font-family:var(--font-ui);color:var(--head);line-height:1.35;margin:0 0 .5em}

/* ---------- الواجهة الرئيسية ---------- */
.hero{background:linear-gradient(160deg,var(--primary),color-mix(in srgb,var(--primary) 75%,#000));color:var(--on-primary);border-radius:24px;padding:34px 22px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);border-radius:18px;pointer-events:none}
.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:600;letter-spacing:.05em}
.brand-title{font-family:var(--font-text);font-size:clamp(40px,10vw,64px);color:var(--on-primary);margin:0}
.brand-title span{font-size:.45em;letter-spacing:.2em;opacity:.8;direction:ltr;display:inline-block}
.tagline{font-family:var(--font-text);font-size:clamp(20px,4.6vw,28px);color:var(--accent);margin:.2em 0 .6em}
.lead{max-width:620px;margin:0 auto 20px;opacity:.92}
.search{display:flex;gap:8px;max-width:520px;margin:0 auto}
.search input{flex:1;min-width:0;padding:13px 16px;border-radius:14px;border:2px solid transparent;background:#fff;color:#1b1b1b;font-size:16px}
.search input:focus{border-color:var(--accent);outline:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;transition:transform .15s,box-shadow .15s}
.btn:hover{text-decoration:none;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#1b1b1b;border-color:var(--accent)}
.search .btn{background:var(--accent);color:#1b1b1b;border-color:var(--accent)}
.btn.solid{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:34px 0 14px}
.sec-head h2{margin:0;font-size:1.45rem}
.sec-head p{margin:0;color:var(--muted);font-size:.95rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);color:var(--text);transition:transform .2s,border-color .2s}
a.card:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--accent)}
.sec-card h3{font-size:1.3rem;margin-bottom:.2em}
.sec-card p{margin:.2em 0 .7em;color:var(--muted);font-size:.95rem}
.sec-mark{display:inline-grid;place-items:center;min-width:56px;height:56px;padding:0 10px;border-radius:14px;background:var(--surface2);border:1px solid var(--accent);color:var(--accent-text);font-family:var(--font-text);font-size:1.4rem;font-weight:700;margin-bottom:10px}
.mini{margin:0 0 10px;padding:0;list-style:none;font-size:.9rem;color:var(--muted)}
.mini li{padding:3px 0;border-top:1px dashed var(--border)}
.more{color:var(--accent-text);font-weight:600;font-size:.92rem}

/* ---------- المظهر ---------- */
.theme-card{text-align:start;display:flex;flex-direction:column;gap:10px;cursor:pointer;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:14px}
.theme-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.preview{border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.12);height:92px;display:flex;flex-direction:column}
.preview .pv-bar{height:26px;display:flex;align-items:center;padding:0 10px;gap:6px}
.preview .pv-bar i{width:8px;height:8px;border-radius:50%}
.preview .pv-body{flex:1;padding:10px;display:flex;flex-direction:column;gap:6px}
.preview .pv-body b{height:8px;border-radius:4px;display:block}
.swatches{display:flex;gap:6px}
.swatches i{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.theme-card strong{font-size:1.05rem;color:var(--head)}
.theme-card small{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:10px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg button+button{border-inline-start:1px solid var(--border)}
.mode-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.mode-row span{color:var(--muted)}

/* ---------- القوائم والصفحات ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.crumbs a{color:var(--muted)}
.page-title{font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:.2em}
.page-sub{color:var(--muted);margin:0 0 18px}
.topic-list{display:grid;gap:12px}
.topic-item{display:flex;gap:14px;align-items:flex-start}
.topic-num{flex:none;width:42px;height:42px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700}
.topic-item h3{margin:0 0 .15em;font-size:1.12rem}
.topic-item p{margin:0;color:var(--muted);font-size:.93rem}
.pill{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--accent-text);margin-inline-end:6px;margin-top:6px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* ---------- صفحة الموضوع ---------- */
.topic-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.fav-btn{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.fav-btn svg{width:22px;height:22px;stroke:var(--accent-text);stroke-width:1.8;fill:none;stroke-linejoin:round}
.fav-btn[aria-pressed="true"]{background:var(--primary)}
.fav-btn[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.88rem;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.reading{font-size:calc(var(--fs) * 1px);line-height:var(--lh);max-width:780px}
.reading .b-h{font-size:1.3em;margin-top:1.5em;padding-bottom:.25em;border-bottom:2px solid var(--accent);scroll-margin-top:80px}
.reading .b-p{margin:.6em 0}
.b-list{padding-inline-start:1.4em;margin:.5em 0}
.b-list li{margin:.25em 0}
.reading b{color:var(--head)}
.box{border-radius:var(--radius-sm);padding:12px 16px;margin:1em 0;background:var(--surface2);border:1px solid var(--border);border-inline-start:5px solid var(--accent)}
.box .box-title{font-weight:700;color:var(--accent-text);font-size:.85em;margin-bottom:2px}
.box.note{border-inline-start-color:var(--primary)}
.box.khilaf{border-style:dashed;border-inline-start-style:solid;border-inline-start-color:var(--accent-text)}
.table-wrap{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88em;min-width:460px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--primary);color:var(--on-primary);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.ex-list{display:grid;gap:10px;margin:1em 0}
.ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px}
.ex .ar{font-family:var(--font-text);font-size:1.25em;font-weight:700;color:var(--head);margin:0}
.ex .i3{margin:.3em 0 0;font-size:.88em;color:var(--muted);line-height:1.8}
.ex-title{font-weight:700;color:var(--accent-text);font-size:.9em;margin-top:1em}
.pager{display:flex;gap:10px;justify-content:space-between;margin:34px 0 10px;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;background:var(--surface);color:var(--text)}
.pager small{display:block;color:var(--muted)}

/* ---------- الاختبار ---------- */
.quiz{margin-top:34px;border:2px solid var(--accent);border-radius:var(--radius);padding:18px;background:var(--surface)}
.quiz h2{margin-top:0;font-size:1.3rem}
.quiz-opt-tag{font-size:.8rem;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--muted);margin-inline-start:6px}
.q{padding:14px 0;border-top:1px dashed var(--border)}
.q-text{font-weight:600;margin:0 0 10px;font-size:1.02rem}
.q-text .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:.85rem;margin-inline-end:8px}
.opts{display:grid;gap:8px}
.opt{text-align:start;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--font-text);font-size:1.15rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fill{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1 1 180px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--font-text);font-size:1.15rem}
.fill input:disabled{opacity:.85}
.fill input.correct{border-color:var(--ok);background:var(--ok-bg)}
.fill input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.why{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.95rem;line-height:1.8}
.why.ok{background:var(--ok-bg);color:var(--ok)}
.why.no{background:var(--bad-bg);color:var(--bad)}
.why b{color:inherit}
.score{text-align:center;padding:16px;border-radius:12px;background:var(--surface2);margin-top:14px}
.score strong{font-size:1.6rem;color:var(--head)}

/* ---------- البحث والإعدادات ---------- */
.search-page input[type=search]{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--border);background:var(--surface);font-size:16px}
.search-page input[type=search]:focus{border-color:var(--accent);outline:0}
mark{background:color-mix(in srgb,var(--accent) 45%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.snip{margin:.4em 0 0;color:var(--muted);font-size:.92rem;line-height:1.8}
.set-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px dashed var(--border)}
.set-row:first-of-type{border-top:0}
.set-row label,.set-row .lbl{font-weight:600}
input[type=range]{width:min(260px,100%);accent-color:var(--accent-text)}
.sample{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-family:var(--font-text)}

/* ---------- التذييل ---------- */
.site-footer{background:var(--primary);color:var(--on-primary);border-top:3px solid var(--accent);padding:26px 0 30px;text-align:center}
.credit{display:inline-block;padding:14px 28px;border:1px solid var(--accent);border-radius:14px;margin-bottom:14px}
.credit-ar{font-family:var(--font-text);font-size:1.35rem;font-weight:700;color:var(--on-primary)}
.credit-en{font-size:1.05rem;letter-spacing:.14em;color:var(--accent);margin-top:2px}
.foot-links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.foot-links a{color:var(--on-primary);opacity:.9}
.tag{margin:0;font-family:var(--font-text);color:var(--accent);font-size:1.05rem}
.credit-card{text-align:center;border:1px solid var(--accent);border-radius:var(--radius);padding:22px;background:var(--surface2);margin:18px 0}

.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){
  .hero{padding:28px 14px}
  .topic-top{flex-direction:row}
  .search{flex-direction:column}
}
@media print{.site-header,.site-footer,.quiz,.pager,.toc,.fav-btn{display:none!important}}

</style>
<script>
/* تطبيق الثيم المحفوظ مبكرًا لتفادي الوميض */
(function(){try{var s=JSON.parse(localStorage.getItem('bayan:v1')||'null');if(s){var r=document.documentElement;if(['emerald','navy','burgundy'].indexOf(s.theme)>-1)r.setAttribute('data-theme',s.theme);var d=s.mode==='dark'||(s.mode!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-mode',d?'dark':'light');}}catch(e){}})();
</script>
</head>
<body>

        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </a>
      <a class="icon-btn" href="#/favorites" aria-label="المفضلة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span class="badge" id="fav-badge" hidden>0</span>

      <a class="icon-btn" href="#/settings" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>

<main id="main" class="wrap" tabindex="-1">

<footer class="site-footer">
  <div class="wrap">
    <div class="credit">
      <div class="credit-ar">إعداد الطالب: محمد بنيران</div>
      <div class="credit-en" dir="ltr" lang="en">Mohammed Beniran</div>
    </div>
    <nav class="foot-links" aria-label="روابط التذييل">

  /* ---------- البحث ---------- */
  function norm(s) {
    var out = '', map = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i), code = s.charCodeAt(i);
      if ((code >= 0x64B && code <= 0x65F) || code === 0x670 || code === 0x640 || code === 0x621) continue;
      if ('أإآٱ'.indexOf(c) > -1) c = 'ا';
      else if (c === 'ة') c = 'ه';
      else if (c === 'ى') c = 'ي';
      else if (c === 'ؤ') c = 'و';
      else if (c === 'ئ') c = 'ي';
      out += c.toLowerCase(); map.push(i);
    }
    return { n: out, m: map };
  }
  var INDEX = null;
  function buildIndex() {
    INDEX = B.topics.map(function (t) {
      var parts = [];
      t.blocks.forEach(function (b) {
        if (b.x) parts.push(strip(b.x));
        if (b.title) parts.push(b.title);
        if (b.items) b.items.forEach(function (it) { parts.push(typeof it === 'string' ? strip(it) : strip(it.s + ' ' + it.i)); });
        if (b.head) parts.push(b.head.join(' '));
        if (b.rows) b.rows.forEach(function (r) { parts.push(r.join(' ')); });
      });
      var body = parts.join(' ');
      return { t: t, title: norm(t.title).n, sum: norm(t.sum).n, body: body, nb: norm(body) };
    });
  }
  function search(q) {
    if (!INDEX) buildIndex();
    var toks = norm(q).n.split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    var res = [];
    INDEX.forEach(function (e) {
      var score = 0, ok = true;
      toks.forEach(function (tk) {
        var inT = e.title.indexOf(tk) > -1, inS = e.sum.indexOf(tk) > -1, inB = e.nb.n.indexOf(tk) > -1;
        if (!(inT || inS || inB)) ok = false;
        score += (inT ? 5 : 0) + (inS ? 2 : 0) + (inB ? 1 : 0);
      });
      if (ok) res.push({ e: e, score: score, tk: toks });
    });
    res.sort(function (a, b) { return b.score - a.score; });
    return res;
  }
  function snippet(r) {
    var e = r.e, tk = r.tk, idx = -1, len = 0;
    for (var i = 0; i < tk.length; i++) {
      var p = e.nb.n.indexOf(tk[i]);
      if (p > -1) { idx = p; len = tk[i].length; break; }
    }
    if (idx < 0) return esc(e.t.sum);
    var s0 = e.nb.m[idx], s1 = e.nb.m[Math.min(idx + len - 1, e.nb.m.length - 1)] + 1;
    var from = Math.max(0, s0 - 50), to = Math.min(e.body.length, s1 + 80);
    return (from > 0 ? '… ' : '') + esc(e.body.slice(from, s0)) + '<mark>' + esc(e.body.slice(s0, s1)) + '</mark>' + esc(e.body.slice(s1, to)) + (to < e.body.length ? ' …' : '');
  }

  function plainAns(s) { return String(s).replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/\s+/g, ' ').trim(); }
  function checkFill(q, v) {
    var cands = [q.a].concat(q.alts || []).map(plainAns), x = plainAns(v);
    return x.length > 0 && cands.indexOf(x) > -1;
  }
  function quizHTML(t) {
    var r = S.results[t.id];
    var head = '<h2>اختبر نفسك <span class="quiz-opt-tag">اختياري</span></h2>';
    if (!Q.started) {

        '<button class="btn solid" type="button" data-action="quiz-start">ابدأ الاختبار</button></section>';
    }
    var done = Q.ans.filter(function (a) { return a; }).length, score = Q.ans.filter(function (a) { return a && a.ok; }).length;
    var html = '<section class="quiz" id="quiz" aria-labelledby="quiz-h">' + head.replace('<h2>', '<h2 id="quiz-h">');
    t.quiz.forEach(function (q, i) {
      var a = Q.ans[i];
      html += '<div class="q" id="q' + i + '"><p class="q-text"><span class="n">' + (i + 1) + '</span>' + q.q + '</p>';
      if (q.t === 'mcq') {
        html += '<div class="opts">' + q.o.map(function (o, j) {
          var cls = '';
          if (a) cls = j === q.a ? ' correct' : (j === a.v ? ' wrong' : '');
          return '<button type="button" class="opt' + cls + '" data-action="ans" data-q="' + i + '" data-v="' + j + '"' + (a ? ' disabled' : '') + '>' + o + '</button>';
        }).join('') + '</div>';
      } else if (q.t === 'tf') {
        html += '<div class="opts">' + [['1', 'صح'], ['0', 'خطأ']].map(function (o) {
          var isRight = (o[0] === '1') === q.a, cls = '';
          if (a) cls = isRight ? ' correct' : (a.v === o[0] ? ' wrong' : '');
          return '<button type="button" class="opt' + cls + '" data-action="ans" data-q="' + i + '" data-v="' + o[0] + '"' + (a ? ' disabled' : '') + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      } else {
        html += '<div class="fill"><input type="text" id="f' + i + '" dir="rtl" lang="ar" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="إجابتك" value="' + (a ? esc(a.v) : '') + '"' + (a ? ' disabled class="' + (a.ok ? 'correct' : 'wrong') + '"' : '') + '>' +
          (a ? '' : '<button type="button" class="btn solid" data-action="fill" data-q="' + i + '">تحقق</button>') + '</div>';
      }

          (!a.ok && q.t === 'fill' ? 'الإجابة الصحيحة: <b>' + esc(q.a) + '</b>. ' : '') + q.w + '</div>';

  function viewNotFound() {
    document.title = 'الصفحة غير موجودة — بَيَان';
    return '<div class="empty"><h1 class="page-title">الصفحة غير موجودة</h1><p>الرابط الذي فتحته غير صحيح.</p><a class="btn solid" href="#/">العودة إلى الرئيسية</a></div>';
  }

  /* ---------- التوجيه ---------- */
  var CUR = '';
  function route(hash) {
    var raw = (typeof hash === 'string') ? hash : (location.hash || '');
    CUR = raw;
    var h = raw.replace(/^#\/?/, ''), qs = '';
    var qi = h.indexOf('?');
    if (qi > -1) { qs = h.slice(qi + 1); h = h.slice(0, qi); }
    var p = h.split('/').filter(Boolean), html, scrollTo = null;
    try {
      var name = p[0] || '';
      if (name === '') { html = viewHome(); document.title = 'بَيَان | BAYAN — رحلة في أسرار اللغة العربية'; }
      else if (name === 'appearance') { html = viewHome(); scrollTo = 'appearance'; }
      else if (name === 'section') html = viewSection(p[1]);
      else if (name === 'topic') html = viewTopic(decodeURIComponent(p[1] || ''));
      else if (name === 'favorites') html = viewFavorites();
      else if (name === 'search') {
        var m = /(?:^|&)q=([^&]*)/.exec(qs), q = '';
        try { q = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; } catch (e) { q = ''; }
        html = viewSearch(q);
      }
      else if (name === 'settings') html = viewSettings();
      else if (name === 'about') html = viewAbout();
      else html = viewNotFound();
    } catch (err) {
      if (window.console) console.error(err);
      html = '<div class="empty"><h1 class="page-title">حدث خطأ غير متوقع</h1><p>تعذّر عرض هذه الصفحة.</p><a class="btn solid" href="#/">العودة إلى الرئيسية</a></div>';
    }
    main.innerHTML = html;
    applyPrefs();
    if (scrollTo) {
      var el = document.getElementById(scrollTo);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else window.scrollTo(0, 0);
    if (p[0] === 'search') { var qi2 = document.getElementById('q'); if (qi2 && !qi2.value) qi2.focus(); }
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var a = el.getAttribute('data-action'), d = el.dataset;
    try {
      switch (a) {
        case 'theme':
          S.theme = d.id; save(); applyPrefs();
          document.querySelectorAll('[data-action="theme"]').forEach(function (b) {
            var on = b.getAttribute('data-id') === S.theme;
            b.setAttribute('aria-pressed', on);
            var sm = b.querySelector('small'), th = B.themes.filter(function (t) { return t.id === b.getAttribute('data-id'); })[0];
            if (sm && th) sm.textContent = th.hint + (on ? ' — مُفعَّل' : '');
          });
          break;
        case 'mode':
          S.mode = d.v; save(); applyPrefs();
          document.querySelectorAll('[data-action="mode"]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === S.mode); });
          break;
        case 'toggle-mode':
          S.mode = resolvedMode() === 'dark' ? 'light' : 'dark'; save(); applyPrefs();
          document.querySelectorAll('[data-action="mode"]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === S.mode); });
          break;
        case 'lh':
          S.lh = Number(d.v); save(); applyPrefs();
          document.querySelectorAll('[data-action="lh"]').forEach(function (b) { b.setAttribute('aria-pressed', Number(b.getAttribute('data-v')) === S.lh); });
          break;
        case 'fav':
          var i = S.favs.indexOf(d.id);
          if (i > -1) S.favs.splice(i, 1); else S.favs.push(d.id);
          save(); applyPrefs();
          el.setAttribute('aria-pressed', isFav(d.id));
          el.setAttribute('aria-label', isFav(d.id) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة');
          break;
        case 'scroll':
          var t = document.getElementById(d.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        case 'quiz-start':
          Q.started = true; Q.ans = []; refreshQuiz(topicById(Q.id), false);
          var qz = document.getElementById('quiz'); if (qz) qz.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        case 'quiz-reset':
          Q.started = true; Q.ans = []; refreshQuiz(topicById(Q.id), false);
          var qz2 = document.getElementById('quiz'); if (qz2) qz2.scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        case 'ans': answer(Number(d.q), d.v); break;
        case 'fill':
          var inp = document.getElementById('f' + d.q);
          if (inp) answer(Number(d.q), inp.value);
          break;
        case 'reset-prefs':
          S.theme = DEF.theme; S.mode = DEF.mode; S.fs = DEF.fs; S.lh = DEF.lh; save(); applyPrefs(); route(CUR);
          break;
        case 'clear-data':
          if (window.confirm('سيتم مسح المفضلة ونتائج الاختبارات. هل تريد المتابعة؟')) { S.favs = []; S.results = {}; save(); applyPrefs(); route(CUR); }
          break;
      }
    } catch (err) { if (window.console) console.error(err); }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'fs') {
      S.fs = Number(t.value); save(); applyPrefs();
      var v = document.getElementById('fs-v'); if (v) v.textContent = S.fs;
    } else if (t.id === 'q') {
      var q = t.value;
      document.getElementById('results').innerHTML = resultsHTML(q);
      try { history.replaceState(null, '', '#/search' + (q ? '?q=' + encodeURIComponent(q) : '')); } catch (err) { /* تجاهل */ }
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.getAttribute && e.target.getAttribute('data-form') === 'hero-search') {
      e.preventDefault();
      var q = e.target.elements.q.value.trim();
      go('#/search' + (q ? '?q=' + encodeURIComponent(q) : ''));
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && /^f\d+$/.test(e.target.id || '')) {
      e.preventDefault();
      answer(Number(e.target.id.slice(1)), e.target.value);
    }
  });

  /* تنقّل موثوق حتى في المعاينات التي لا تُطلق hashchange (iframe/عارض الملفات) */
  function go(h) {
    try { location.hash = h; } catch (e) { /* تجاهل */ }
    route(h);
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!a || e.defaultPrevented || e.ctrlKey || e.metaKey || e.shiftKey || e.button > 0) return;
    e.preventDefault();
    go(a.getAttribute('href'));
  });
  window.addEventListener('hashchange', function () { if ((location.hash || '') !== CUR) route(); });
  window.addEventListener('error', function (e) { if (window.console) console.error(e.message); });

  applyPrefs();
  route();
})();

</script>
</body>
</html>
